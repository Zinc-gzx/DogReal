# DogReal Nginx配置文件
# 
# 使用方法:
# 1. 复制此文件到服务器: scp nginx.conf root@server-ip:/tmp/
# 2. 修改文件中的域名: sudo nano /tmp/nginx.conf
# 3. 移动到Nginx配置目录: sudo mv /tmp/nginx.conf /etc/nginx/sites-available/dogreal
# 4. 创建软链接: sudo ln -s /etc/nginx/sites-available/dogreal /etc/nginx/sites-enabled/
# 5. 测试配置: sudo nginx -t
# 6. 重启Nginx: sudo systemctl restart nginx

# HTTP配置 (安装SSL后会自动重定向到HTTPS)
server {
    listen 80;
    listen [::]:80;
    
    # ⚠️ 修改为你的域名
    server_name api.yourdomain.com;
    
    # 增加上传文件大小限制（根据需要调整）
    client_max_body_size 50M;
    
    # 请求体缓冲
    client_body_buffer_size 16k;
    
    # 日志配置
    access_log /var/log/nginx/dogreal_access.log;
    error_log /var/log/nginx/dogreal_error.log;
    
    # API代理到Node.js后端
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # WebSocket支持（如果需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        proxy_cache_bypass $http_upgrade;
    }
    
    # 静态文件（上传的图片）
    location /uploads {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 缓存设置（可选，提高性能）
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    
    # 健康检查端点
    location /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        access_log off;  # 不记录健康检查日志
    }
    
    # 根路径（可选）
    location / {
        return 200 '{"message":"DogReal API Server","version":"1.0.0"}';
        add_header Content-Type application/json;
    }
}

